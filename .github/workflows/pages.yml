name: Deploy home a GitHub Pages

on:
  push:
    branches: [main]
  # Los otros repos no se modifican, así que no pueden avisar cuando activan
  # Pages: se reconstruye periódicamente para descubrir sitios nuevos.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

# Permisos mínimos: leer el repo y desplegar Pages vía OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/configure-pages@v5

      - name: Generar sitio
        env:
          # Opcional: un PAT de solo lectura en el secreto HOME_PAGES_TOKEN
          # permite incluir repos privados con Pages y dominios personalizados.
          # Sin él se usa el GITHUB_TOKEN efímero del workflow (repos públicos).
          GITHUB_TOKEN: ${{ secrets.HOME_PAGES_TOKEN || github.token }}
          INCLUDE_PRIVATE: ${{ secrets.HOME_PAGES_TOKEN != '' }}
        run: node scripts/build.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
