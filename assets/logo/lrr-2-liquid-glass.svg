<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<title>LRR · Liquid Glass</title>
<defs>
  <filter id="lrr2-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="90"/></filter>
  <filter id="lrr2-frost" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="40"/>
    <feColorMatrix type="matrix" values=".8 0 0 0 .2  0 .8 0 0 .2  0 0 .8 0 .24  0 0 0 1 0"/>
  </filter>
  <filter id="lrr2-shadow" x="-20%" y="-20%" width="140%" height="160%">
    <feGaussianBlur stdDeviation="20"/>
  </filter>
  <filter id="lrr2-soft"><feGaussianBlur stdDeviation="4"/></filter>
  <mask id="lrr2-body" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
    <path transform="translate(512 512) scale(0.8) translate(-371 -180)" d="M0 0V360H150M266 360V0H351A95 95 0 0 1 351 190H266M341 190L446 360M562 360V0H647A95 95 0 0 1 647 190H562M637 190L742 360" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#fff" stroke-width="62"/>
  </mask>
  <linearGradient id="lrr2-spec" gradientUnits="userSpaceOnUse" x1="0" y1="350" x2="0" y2="690">
    <stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".45" stop-color="#fff" stop-opacity=".15"/>
    <stop offset=".8" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".45"/>
  </linearGradient>
  <linearGradient id="lrr2-rim" gradientUnits="userSpaceOnUse" x1="180" y1="340" x2="840" y2="700">
    <stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/>
    <stop offset="1" stop-color="#fff" stop-opacity=".8"/>
  </linearGradient>
</defs>
<rect width="1024" height="1024" fill="#14112A"/>
<g filter="url(#lrr2-blur)">
    <circle cx="250" cy="260" r="260" fill="#FF4FA0"/>
    <circle cx="800" cy="230" r="250" fill="#3AD0FF"/>
    <circle cx="760" cy="820" r="300" fill="#7A5CFF"/>
    <circle cx="230" cy="830" r="250" fill="#FFB547"/>
  </g>
<rect width="1024" height="1024" fill="#0B0A1C" opacity=".18"/>
<!-- sombra -->
<g opacity=".45" filter="url(#lrr2-shadow)" transform="translate(0 26)"><path transform="translate(512 512) scale(0.8) translate(-371 -180)" d="M0 0V360H150M266 360V0H351A95 95 0 0 1 351 190H266M341 190L446 360M562 360V0H647A95 95 0 0 1 647 190H562M637 190L742 360" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#05040F" stroke-width="64"/></g>
<!-- borde (rim) -->
<path transform="translate(512 512) scale(0.8) translate(-371 -180)" d="M0 0V360H150M266 360V0H351A95 95 0 0 1 351 190H266M341 190L446 360M562 360V0H647A95 95 0 0 1 647 190H562M637 190L742 360" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="url(#lrr2-rim)" stroke-width="70"/>
<!-- cuerpo esmerilado: el fondo, más desenfocado y aclarado -->
<g mask="url(#lrr2-body)">
  <rect width="1024" height="1024" fill="#8C84C8"/>
  <g filter="url(#lrr2-frost)"><g >
    <circle cx="250" cy="260" r="260" fill="#FF4FA0"/>
    <circle cx="800" cy="230" r="250" fill="#3AD0FF"/>
    <circle cx="760" cy="820" r="300" fill="#7A5CFF"/>
    <circle cx="230" cy="830" r="250" fill="#FFB547"/>
  </g></g>
  <g filter="url(#lrr2-soft)" transform="translate(0 -6)"><path transform="translate(512 512) scale(0.8) translate(-371 -180)" d="M0 0V360H150M266 360V0H351A95 95 0 0 1 351 190H266M341 190L446 360M562 360V0H647A95 95 0 0 1 647 190H562M637 190L742 360" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="url(#lrr2-spec)" stroke-width="40"/></g>
</g>
</svg>
