<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<title>LRR · Índigo</title>
<defs>
  <linearGradient id="lrr1-bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#6E9BFF"/><stop offset=".55" stop-color="#3F5BF2"/><stop offset="1" stop-color="#2A2BC4"/>
  </linearGradient>
  <radialGradient id="lrr1-glow" cx=".28" cy=".12" r=".75">
    <stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="lrr1-vig" cx=".5" cy="1.05" r=".7">
    <stop offset="0" stop-color="#140C6B" stop-opacity=".55"/><stop offset="1" stop-color="#140C6B" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="lrr1-ink" gradientUnits="userSpaceOnUse" x1="0" y1="340" x2="0" y2="700">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DCE4FF"/>
  </linearGradient>
  <filter id="lrr1-shadow" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#0D1270" flood-opacity=".45"/>
  </filter>
  <filter id="lrr1-soft"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<rect width="1024" height="1024" fill="url(#lrr1-bg)"/>
<rect width="1024" height="1024" fill="url(#lrr1-glow)"/>
<rect width="1024" height="1024" fill="url(#lrr1-vig)"/>
