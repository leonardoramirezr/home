<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<title>LRR · Monograma oro</title>
<defs>
  <radialGradient id="lrr4-bg" cx=".5" cy=".3" r=".9">
    <stop offset="0" stop-color="#3A3E48"/><stop offset=".6" stop-color="#1E2026"/><stop offset="1" stop-color="#0E0F12"/>
  </radialGradient>
  <linearGradient id="lrr4-gold" gradientUnits="userSpaceOnUse" x1="200" y1="320" x2="820" y2="740">
    <stop offset="0" stop-color="#FFF1B8"/><stop offset=".28" stop-color="#E9C25A"/>
    <stop offset=".5" stop-color="#B9852A"/><stop offset=".72" stop-color="#F3D27A"/>
    <stop offset="1" stop-color="#9A6B1C"/>
  </linearGradient>
  <linearGradient id="lrr4-frame" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F6DE8E" stop-opacity=".9"/><stop offset=".5" stop-color="#A57826" stop-opacity=".45"/>
    <stop offset="1" stop-color="#F6DE8E" stop-opacity=".8"/>
  </linearGradient>
  <filter id="lrr4-bevel" x="-10%" y="-10%" width="120%" height="130%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="b"/>
    <feSpecularLighting in="b" surfaceScale="7" specularConstant="1.1" specularExponent="22" lighting-color="#FFF6D6" result="s">
      <fePointLight x="250" y="120" z="420"/>
    </feSpecularLighting>
    <feComposite in="s" in2="SourceAlpha" operator="in" result="sIn"/>
    <feComposite in="SourceGraphic" in2="sIn" operator="arithmetic" k2="1" k3=".75"/>
  </filter>
  <filter id="lrr4-shadow" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity=".6"/>
  </filter>
</defs>
<rect width="1024" height="1024" fill="url(#lrr4-bg)"/>
<!-- marco fino -->
<rect x="96" y="96" width="832" height="832" rx="190" fill="none" stroke="url(#lrr4-frame)" stroke-width="6"/>
<rect x="118" y="118" width="788" height="788" rx="170" fill="none" stroke="#E9C25A" stroke-opacity=".18" stroke-width="2"/>
<g filter="url(#lrr4-shadow)"><g filter="url(#lrr4-bevel)"><path transform="translate(512 520) scale(0.78) translate(-371 -220)" d="M0 0V440H742M266 360V0H351A95 95 0 0 1 351 190H266M341 190L446 360M562 360V0H647A95 95 0 0 1 647 190H562M637 190L742 360" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="url(#lrr4-gold)" stroke-width="64"/></g></g>
</svg>
