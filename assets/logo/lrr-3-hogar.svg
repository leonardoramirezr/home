<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<title>LRR · Hogar</title>
<defs>
  <linearGradient id="lrr3-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFB23F"/><stop offset=".5" stop-color="#FF6B45"/><stop offset="1" stop-color="#E8345E"/>
  </linearGradient>
  <radialGradient id="lrr3-glow" cx=".3" cy=".1" r=".8">
    <stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="lrr3-wall" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFEDE4"/>
  </linearGradient>
  <linearGradient id="lrr3-ink" gradientUnits="userSpaceOnUse" x1="250" y1="500" x2="780" y2="830">
    <stop offset="0" stop-color="#FF8A3D"/><stop offset="1" stop-color="#E5335F"/>
  </linearGradient>
  <filter id="lrr3-shadow" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="26" stdDeviation="26" flood-color="#8A1636" flood-opacity=".4"/>
  </filter>
  <filter id="lrr3-inset" x="-10%" y="-10%" width="120%" height="130%">
    <feOffset dy="6"/><feGaussianBlur stdDeviation="5" result="o"/>
    <feComposite in="SourceAlpha" in2="o" operator="out" result="edge"/>
    <feFlood flood-color="#7A0F2E" flood-opacity=".55"/><feComposite in2="edge" operator="in" result="sh"/>
    <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="sh"/></feMerge>
  </filter>
</defs>
<rect width="1024" height="1024" fill="url(#lrr3-bg)"/>
<rect width="1024" height="1024" fill="url(#lrr3-glow)"/>
<!-- chimenea -->
<rect x="672" y="250" width="74" height="170" rx="18" fill="#FFF3EC" filter="url(#lrr3-shadow)"/>
<path d="M512 205L848 478H772V832H252V478H176Z" fill="url(#lrr3-wall)" stroke="url(#lrr3-wall)" stroke-width="56" stroke-linejoin="round" filter="url(#lrr3-shadow)"/>
<!-- alero -->
<path d="M200 470L512 216L824 470" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
<g filter="url(#lrr3-inset)"><path transform="translate(512 664) scale(0.56) translate(-371 -180)" d="M0 0V360H150M266 360V0H351A95 95 0 0 1 351 190H266M341 190L446 360M562 360V0H647A95 95 0 0 1 647 190H562M637 190L742 360" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="url(#lrr3-ink)" stroke-width="64"/></g>
</svg>
